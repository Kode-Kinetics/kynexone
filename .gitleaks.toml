# Zayra secret-scan configuration (gitleaks).
# Runs the full default ruleset (see [extend]) and fails CI on any real secret.
# The allowlists below remove deterministic FALSE POSITIVES only:
#   • build artifacts / local env files that never exist in a clean CI checkout;
#   • obviously-synthetic TEST fixture keys (named "TEST_…", "…MUST_BE_64_CHARS…").
# It deliberately does NOT blanket-allowlist the test projects — a realistic secret
# hardcoded in a test would still trip the scan.
title = "Zayra gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Build artifacts, local env, lockfiles, and synthetic test fixtures"
# File paths that are gitignored (absent from CI) or are lockfiles/build output.
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.vercel/''',
  '''(^|/)\.env(\.[^/]+)?\.local$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)(bin|obj|dist|out)/''',
]
# Secret VALUES that are plainly synthetic test fixtures (not real credentials).
regexes = [
  '''(?i)(test|example|sample|dummy|placeholder|changeme|fake|invalid)[-_ ]?(audience|signing|jwt|secret|api|access|token|key)''',
  '''MUST_BE_\d+_CHARS''',
]

# ── Repo-specific rules ──────────────────────────────────────────────────────────────
# The default rules recognise a secret by its SHAPE: a known key prefix, or
# `password = "…"` with enough entropy. A browser script that signs in positionally,
# `inputs.nth(1).fill('…')`, has neither, so thirteen scripts that signed in to the live
# pilot passed this scan. These two rules match the CONTEXT instead: automation aimed at
# a deployed host, or a login call to a deployed host with a password in the same line.
# Local and CI targets (localhost, 127.0.0.1) are deliberately not matched.
[[rules]]
id = "kynexone-deployed-host-browser-script"
description = "Browser automation aimed at a deployed host; such scripts carry real sign-ins"
regex = '''(?i)baseURL\s*:\s*['"`]https://[a-z0-9.-]+\.(vercel\.app|onrender\.com)'''
keywords = ["baseurl"]

[[rules]]
id = "kynexone-deployed-host-login-with-password"
description = "A login request to a deployed host with a password on the same line"
regex = '''(?i)(https://[a-z0-9.-]+\.(vercel\.app|onrender\.com)/api/[a-z0-9/_-]*login[^\n]{0,400}password|password[^\n]{0,400}https://[a-z0-9.-]+\.(vercel\.app|onrender\.com)/api/[a-z0-9/_-]*login)'''
keywords = ["password"]
