# KynexOne — client installation (WP9). One organisation, one server.
#
#   proxy (Caddy: HTTPS, the only published ports) -> web (Next.js) and backend (ASP.NET Core API)
#   backend -> postgres, redis, and the `documents` volume   migrate: the one-shot schema step before backend starts
#   ollama: optional local AI (`docker compose --profile ai up -d`)
#
# Everything is configured from .env (scripts/install.sh writes it from .env.example). Nothing but the proxy is
# reachable from outside the host: every other service listens on the internal `kynexone` network only.
name: kynexone

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# The API's settings, shared by `migrate` and `backend` (one image, two roles).
x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://0.0.0.0:5117
  APP_URL: https://${KYNEXONE_DOMAIN:?set KYNEXONE_DOMAIN in .env}
  Cors__AllowedOrigins__0: https://${KYNEXONE_DOMAIN}
  ConnectionStrings__Default: Host=postgres;Port=5432;Database=kynexone;Username=kynexone;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  # Migrations are applied by the `migrate` service, never by a serving process.
  Database__RunMigrationsOnStartup: "false"
  Jwt__Issuer: KynexOne
  Jwt__Audience: ${JWT_AUDIENCE:?set JWT_AUDIENCE in .env}
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
  # The proxy terminates TLS: trust X-Forwarded-* from the internal network only. The web server proves the
  # client IP it forwards with the shared secret (frontend/middleware.ts).
  Proxy__TrustForwardedHeaders: "true"
  Proxy__KnownNetworks: ${KYNEXONE_SUBNET:-172.30.50.0/24}
  Proxy__ClientIpSecret: ${PROXY_CLIENT_IP_SECRET:?set PROXY_CLIENT_IP_SECRET in .env}
  REDIS_URL: redis://redis:6379
  # Documents: the `documents` volume (local), or an external S3-compatible store (s3).
  Storage__Provider: ${STORAGE_PROVIDER:-local}
  Storage__LocalRoot: /var/lib/kynexone/documents
  Storage__Endpoint: ${STORAGE_ENDPOINT:-}
  Storage__Bucket: ${STORAGE_BUCKET:-}
  Storage__AccessKey: ${STORAGE_ACCESS_KEY:-}
  Storage__SecretKey: ${STORAGE_SECRET_KEY:-}
  Storage__Region: ${STORAGE_REGION:-auto}
  Storage__ResidencyAllowList__0: ${STORAGE_RESIDENCY_ENDPOINT:-}
  Storage__ResidencyAllowList__1: ${STORAGE_RESIDENCY_REGION:-}
  Email__DeliveryMode: ${EMAIL_DELIVERY_MODE:-smtp}
  Smtp__Host: ${SMTP_HOST:-}
  Smtp__Port: ${SMTP_PORT:-587}
  Smtp__UseSsl: ${SMTP_USE_SSL:-true}
  Smtp__Username: ${SMTP_USERNAME:-}
  Smtp__Password: ${SMTP_PASSWORD:-}
  Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
  Smtp__FromName: ${SMTP_FROM_NAME:-KynexOne}
  # AI is off unless chosen. `ollama` keeps employee data on the organisation's network; a cloud provider does not.
  AI_PROVIDER: ${AI_PROVIDER:-none}
  AI_MODEL: ${AI_MODEL:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # Mobile push goes through Expo's service on the internet: off unless the organisation allows that traffic.
  Notifications__Push__Enabled: ${PUSH_ENABLED:-false}
  QuestPdf__License: ${QUESTPDF_LICENSE:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: kynexone
      POSTGRES_USER: kynexone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kynexone -d kynexone"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-2g}
    networks: [kynexone]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [kynexone]

  # Applies the database migrations this image carries, then exits. backend starts only after it succeeds.
  migrate:
    image: ${KYNEXONE_REGISTRY:-kynexone}/kynexone-api:${KYNEXONE_VERSION:?set KYNEXONE_VERSION in .env}
    restart: "no"
    logging: *logging
    command: ["--migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *api-environment
    networks: [kynexone]

  backend:
    image: ${KYNEXONE_REGISTRY:-kynexone}/kynexone-api:${KYNEXONE_VERSION}
    restart: unless-stopped
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *api-environment
    volumes:
      - documents:/var/lib/kynexone/documents
    healthcheck:
      # The image has no curl/wget: bash's /dev/tcp asks /health/ready, which is 200 only when the database is
      # reachable and every migration this image carries is applied.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5117 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-4g}
    networks: [kynexone]

  web:
    image: ${KYNEXONE_REGISTRY:-kynexone}/kynexone-web:${KYNEXONE_VERSION}
    restart: unless-stopped
    logging: *logging
    depends_on: [backend]
    # Built with NEXT_PUBLIC_API_BASE_URL=http://backend:5117: its server-side /api rewrite reaches `backend`.
    environment:
      PROXY_CLIENT_IP_SECRET: ${PROXY_CLIENT_IP_SECRET}
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [kynexone]

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *logging
    depends_on: [backend, web]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      KYNEXONE_DOMAIN: ${KYNEXONE_DOMAIN}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [kynexone]

  # Optional local AI model server: `docker compose --profile ai up -d`, then AI_PROVIDER=ollama in .env.
  ollama:
    image: ollama/ollama:0.6.8
    profiles: ["ai"]
    restart: unless-stopped
    logging: *logging
    volumes:
      - ollama-data:/root/.ollama
    networks: [kynexone]

networks:
  kynexone:
    ipam:
      config:
        - subnet: ${KYNEXONE_SUBNET:-172.30.50.0/24}

volumes:
  pgdata:
  documents:
  caddy-data:
  caddy-config:
  ollama-data:
