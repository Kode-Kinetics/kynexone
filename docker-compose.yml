services:
  postgres:
    image: postgres:16-alpine
    container_name: zayra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-zayra}
      POSTGRES_USER: ${POSTGRES_USER:-zayra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zayra_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zayra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zayra} -d ${POSTGRES_DATABASE:-zayra}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      # The one API image definition (root Dockerfile), the same image the client kit runs.
      context: .
      dockerfile: Dockerfile
      # Baked into the image and reported by /health/live; the e2e preflight compares it with the
      # commit under test. `BUILD_COMMIT=$(git rev-parse HEAD) docker compose up -d --build`.
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
        # true in CI after scripts/ci/ci-licence.sh: the image also trusts that run's licence key.
        CI_LICENCE_KEY: ${CI_LICENCE_KEY:-false}
    container_name: zayra-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5117
      APP_URL: ${APP_URL:-http://localhost:5173}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DATABASE:-zayra};Username=${POSTGRES_USER:-zayra};Password=${POSTGRES_PASSWORD:-zayra_password}
      # Compose owns an isolated Development database, so migrate it before AuthSeeder runs.
      # Without this, EnsureCreated produces a schema with no migration history and readiness
      # correctly reports every migration as pending. Production still uses the CI/pre-deploy gate.
      Database__RunMigrationsOnStartup: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      # Safe test delivery (F09): this stack never sends email. Every message is captured inside the
      # API and written as .eml under /tmp/kynexone-captured-mail, so a local or CI run cannot reach
      # a real employee even if an SMTP relay is saved in its database. EMAIL_DELIVERY_MODE=smtp
      # opts a developer back into a real relay; EMAIL_ALLOWED_RECIPIENTS then limits who receives it.
      Email__DeliveryMode: ${EMAIL_DELIVERY_MODE:-capture}
      Email__CaptureDirectory: ${EMAIL_CAPTURE_DIRECTORY:-/tmp/kynexone-captured-mail}
      Email__AllowedRecipients: ${EMAIL_ALLOWED_RECIPIENTS:-}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL: ${AI_MODEL:-gpt-oss:120b-cloud}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11435}
      AI_MAX_CONTEXT_TOKENS: ${AI_MAX_CONTEXT_TOKENS:-4096}
      AI_REQUIRE_HUMAN_REVIEW: ${AI_REQUIRE_HUMAN_REVIEW:-true}
      AI_LOG_PROMPTS: ${AI_LOG_PROMPTS:-false}
      Jwt__Issuer: ${JWT_ISSUER:-Zayra.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Zayra.Client}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-CHANGE_ME_TO_A_64_CHARACTER_PRODUCTION_SECRET_KEY_1234567890}
      # No bootstrap admin and no seeded organisation: a compose stack starts with an EMPTY database.
      # Create the organisation and its first administrator once with
      #   docker compose exec backend dotnet Zayra.Api.dll --setup-organisation
      # (docs/DATA_ENTRY_PATHS.md).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Deployed/local default remains 10/minute. An isolated broad browser suite may opt into a
      # larger login budget without changing the production security default.
      RateLimit__LoginPermitLimit: ${LOGIN_PERMIT_LIMIT:-10}
      # Pre-hash login refusals (LoginAbuseGuard) and the PBKDF2 concurrency gate. Production
      # defaults; a browser suite that signs the same personas in many times raises them.
      Auth__LoginThrottle__AccountIpAttempts: ${LOGIN_ACCOUNT_IP_ATTEMPT_LIMIT:-10}
      Auth__LoginThrottle__AccountAttempts: ${LOGIN_ACCOUNT_ATTEMPT_LIMIT:-50}
      Auth__LoginThrottle__IpFailures: ${LOGIN_IP_FAILURE_LIMIT:-150}
      Auth__PasswordVerification__MaxConcurrency: ${PASSWORD_HASH_CONCURRENCY:-1}
    ports:
      - "${BACKEND_PORT:-5117}:5117"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zayra-documents:/app/storage

  frontend:
    build:
      context: ./frontend
      # Served at /build-info; see the backend's BUILD_COMMIT above.
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    container_name: zayra-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Browser calls stay relative; these values are consumed by the Next.js
      # server-side rewrite, where the Compose service hostname is resolvable.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:5117}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://backend:5117}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  redis:
    image: redis:7-alpine
    container_name: zayra-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  zayra-postgres-data:
  zayra-documents:
