name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Schema drift gate ─────────────────────────────────────────────────────────
  # Twice now, entity properties were added without a matching EF migration. The
  # build passed, the deploy succeeded, and production then threw 42703 ("column
  # does not exist") on the first query touching the new column — taking down
  # /api/auth/login for every user. This job fails the PR instead.
  migration-drift:
    name: Migration Drift (schema gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install EF Core tools
        run: dotnet tool restore

      - name: Fail if the EF model has changes with no migration
        run: |
          # Exits non-zero when the entity model no longer matches the last migration
          # snapshot — i.e. someone changed an entity and forgot `dotnet ef migrations add`.
          dotnet ef migrations has-pending-model-changes \
            --project backend-dotnet/Zayra.Api \
            || {
              echo "::error::EF model has changes with no corresponding migration."
              echo "::error::Run: dotnet ef migrations add <Name> --project backend-dotnet/Zayra.Api"
              exit 1
            }

  # ── Backend: build + security regression gate ──────────────────────────────────
  backend-tests:
    name: Backend Tests (security gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend-dotnet/Zayra.Api.Tests/Zayra.Api.Tests.csproj

      - name: Build
        run: dotnet build backend-dotnet/Zayra.Api.Tests/Zayra.Api.Tests.csproj --no-restore -c Release

      - name: Run security + regression tests
        run: |
          dotnet test backend-dotnet/Zayra.Api.Tests/Zayra.Api.Tests.csproj \
            --no-build -c Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend-dotnet/Zayra.Api.Tests/TestResults/test-results.trx

  # ── Frontend: typecheck ───────────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript typecheck
        run: npx tsc --noEmit
        working-directory: frontend

  # ── Security gate: secret scan ────────────────────────────────────────────────
  # Blocks any commit that introduces a hardcoded secret (JWT key, DB password, cloud
  # token) from reaching the deploy step. Scans the full history on push.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # ── Security gate: dependency vulnerability scan ──────────────────────────────
  # Fails the build on any known-High/Critical vulnerable NuGet or npm package so a
  # vulnerable dependency bump cannot auto-deploy.
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (for transitive graph)
        run: dotnet restore backend-dotnet/Zayra.Api/Zayra.Api.csproj

      - name: dotnet vulnerable package audit (fail on any)
        run: |
          echo "Scanning NuGet packages (including transitive) for known vulnerabilities…"
          dotnet list backend-dotnet/Zayra.Api/Zayra.Api.csproj package --vulnerable --include-transitive 2>&1 | tee dotnet-vuln.txt
          if grep -Eiq "Critical|High|Moderate" dotnet-vuln.txt; then
            echo "::error::Vulnerable NuGet package(s) detected (Moderate+). See log above."
            exit 1
          fi
          echo "No Moderate+ NuGet vulnerabilities."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (fail on High+)
        run: npm audit --audit-level=high
        working-directory: frontend

  # ── Deploy: trigger Render redeploy after tests + security gates pass (main only) ──
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck, secret-scan, dependency-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -sf -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set — Render will auto-deploy via render.yaml blueprint."
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
