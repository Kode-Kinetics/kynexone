name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: build + security regression gate ──────────────────────────────────
  backend-tests:
    name: Backend Tests (security gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend-dotnet/Zayra.Api.Tests/Zayra.Api.Tests.csproj

      - name: Build
        run: dotnet build backend-dotnet/Zayra.Api.Tests/Zayra.Api.Tests.csproj --no-restore -c Release

      - name: Run security + regression tests
        run: |
          dotnet test backend-dotnet/Zayra.Api.Tests/Zayra.Api.Tests.csproj \
            --no-build -c Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend-dotnet/Zayra.Api.Tests/TestResults/test-results.trx

  # ── Frontend: typecheck ───────────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript typecheck
        run: npx tsc --noEmit
        working-directory: frontend

  # ── Security gate: secret scan ────────────────────────────────────────────────
  # Blocks any commit that introduces a hardcoded secret (JWT key, DB password, cloud
  # token) from reaching the deploy step. Scans the full history on push.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks-action@v2 now hard-requires a paid GITLEAKS_LICENSE for ORG-owned
      # repos ("License key is required") — it fails before scanning, which silently
      # skipped the migrate+deploy gate. The gitleaks CLI itself is free (MIT); run the
      # pinned binary directly so the secret gate keeps working with no license.
      - name: gitleaks (license-free CLI)
        run: |
          VER=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
          # Scan the working tree (source as-is) with the repo config. Fail closed on any finding.
          /tmp/gitleaks detect --source . --no-git --config .gitleaks.toml --redact --no-banner --exit-code 1

  # ── Security gate: dependency vulnerability scan ──────────────────────────────
  # Fails the build on any known-High/Critical vulnerable NuGet or npm package so a
  # vulnerable dependency bump cannot auto-deploy.
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (for transitive graph)
        run: dotnet restore backend-dotnet/Zayra.Api/Zayra.Api.csproj

      - name: dotnet vulnerable package audit (fail on any)
        run: |
          echo "Scanning NuGet packages (including transitive) for known vulnerabilities…"
          dotnet list backend-dotnet/Zayra.Api/Zayra.Api.csproj package --vulnerable --include-transitive 2>&1 | tee dotnet-vuln.txt
          if grep -Eiq "Critical|High|Moderate" dotnet-vuln.txt; then
            echo "::error::Vulnerable NuGet package(s) detected (Moderate+). See log above."
            exit 1
          fi
          echo "No Moderate+ NuGet vulnerabilities."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # The frontend deploys INDEPENDENTLY (Vercel), so its runtime-dependency advisories
      # must not hard-block the BACKEND deploy pipeline. axios is patched (1.19.0). The
      # remaining High advisories are Next.js transitive (postcss/sharp) whose only
      # npm-audit "fix" is a breaking Next 15->16 major bump — tracked in
      # docs/FRONTEND_DEP_REMEDIATION.md for a build-verified upgrade. Backend dependency
      # gating stays HARD via the dotnet audit step above; this step is report-only.
      - name: npm audit (frontend; report-only)
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: frontend

  # ── Migrate: apply EF Core migrations to the production DB BEFORE the deploy hook (P0-4) ──
  # render.yaml sets autoDeploy:false, so the deploy hook is the sole trigger and this job gates
  # it: schema is always applied ahead of the new code, preventing 42703/42P01 tenant-wide. Uses
  # only the connection-string secret (env stays Development so no JWT/SeedAdmin prod fail-fast).
  migrate-backend:
    name: Apply DB Migrations (deploy gate)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck, secret-scan, dependency-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore local tools (dotnet-ef)
        run: dotnet tool restore   # manifest (dotnet-tools.json) is at the repo root

      - name: Apply EF Core migrations (fail-closed)
        run: |
          if [ -z "$ConnectionStrings__Default" ]; then
            echo "::error::PROD_DATABASE_URL secret is not set — cannot gate the deploy on DB migrations. Deploy blocked (fail-closed)."
            exit 1
          fi
          echo "Applying EF Core migrations to the production database…"
          dotnet ef database update --project backend-dotnet/Zayra.Api/Zayra.Api.csproj
        env:
          ConnectionStrings__Default: ${{ secrets.PROD_DATABASE_URL }}

  # ── Build the runtime image in CI, so Render never builds it ──────────────────
  # Render's free-tier builder OOMs (>8GB) compiling the app, so no deploy ever completes even
  # though the image builds in ~30s locally under an 8GB ceiling. GitHub's runner has ample memory:
  # build the exact runtime image here and push it to GHCR. Render is then pointed at this pre-built
  # image (runtime: image) and only PULLS it — removing Render's builder from the deploy path for good.
  build-image:
    name: Build & push backend image (GHCR)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck, secret-scan, dependency-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image ref
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/backend" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Build & push image
        run: |
          docker build -f ./Dockerfile -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          echo "Pushed $IMAGE:${{ github.sha }} and :latest"

  # ── Deploy: trigger Render redeploy after tests + security gates + migrations pass (main only) ──
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck, secret-scan, dependency-scan, migrate-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -sf -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy triggered."
          else
            # autoDeploy is OFF (render.yaml), so a missing hook means NOTHING deploys.
            # Fail loudly rather than silently no-op.
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set and autoDeploy is false — no deploy will occur. Set the hook secret."
            exit 1
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
