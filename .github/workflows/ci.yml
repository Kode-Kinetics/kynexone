name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A run parked on the `production` environment reviewer counts as IN PROGRESS for concurrency, so
# the previous `cancel-in-progress: true` on a branch-wide group cancelled pending approvals. Four
# of six consecutive merges to main died exactly that way — migrate-backend showed `cancelled`,
# which reads like `skipped`, while Render's autoDeploy shipped the code anyway. Production ran new
# code against an old schema until /health/ready returned 42P01 for a table a migration creates.
#
# PRs keep the cheap behaviour: one run per PR, superseded runs cancelled.
# Pushes to main get a group unique per run, so no main run can cancel another and no pending
# approval is ever destroyed by a later merge.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      github.event_name == 'push' && github.run_id || github.ref
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Backend: build + security regression gate ──────────────────────────────────
  backend-tests:
    name: Backend Tests (security gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend-dotnet/Zayra.Api.Tests/Zayra.Api.Tests.csproj

      - name: Build
        run: dotnet build backend-dotnet/Zayra.Api.Tests/Zayra.Api.Tests.csproj --no-restore -c Release

      - name: Run security + regression tests
        run: |
          dotnet test backend-dotnet/Zayra.Api.Tests/Zayra.Api.Tests.csproj \
            --no-build -c Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend-dotnet/Zayra.Api.Tests/TestResults/test-results.trx

  # ── Frontend: typecheck ───────────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript typecheck
        run: npx tsc --noEmit
        working-directory: frontend

  # ── Security gate: secret scan ────────────────────────────────────────────────
  # Blocks any commit that introduces a hardcoded secret (JWT key, DB password, cloud
  # token) from reaching the deploy step. Scans the full history on push.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks-action@v2 now hard-requires a paid GITLEAKS_LICENSE for ORG-owned
      # repos ("License key is required") — it fails before scanning, which silently
      # skipped the migrate+deploy gate. The gitleaks CLI itself is free (MIT); run the
      # pinned binary directly so the secret gate keeps working with no license.
      - name: gitleaks (license-free CLI)
        run: |
          VER=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
          # Scan the working tree (source as-is) with the repo config. Fail closed on any finding.
          /tmp/gitleaks detect --source . --no-git --config .gitleaks.toml --redact --no-banner --exit-code 1

  # ── Security gate: dependency vulnerability scan ──────────────────────────────
  # Fails the build on any known-High/Critical vulnerable NuGet or npm package so a
  # vulnerable dependency bump cannot auto-deploy.
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (for transitive graph)
        run: dotnet restore backend-dotnet/Zayra.Api/Zayra.Api.csproj

      - name: dotnet vulnerable package audit (fail on any)
        run: |
          echo "Scanning NuGet packages (including transitive) for known vulnerabilities…"
          # set -o pipefail: without it the pipeline exits with tee's status, so a restore or
          # tooling failure writes an error into the file, grep matches nothing, and this step
          # prints "No Moderate+ NuGet vulnerabilities" and passes. schema-gates guards against
          # this exact shape; this step did not.
          set -o pipefail
          dotnet list backend-dotnet/Zayra.Api/Zayra.Api.csproj package --vulnerable --include-transitive 2>&1 | tee dotnet-vuln.txt
          if ! grep -q "The following sources were used" dotnet-vuln.txt && ! grep -qi "has no vulnerable packages\|Project .* has the following vulnerable" dotnet-vuln.txt; then
            echo "::error::dotnet list produced no recognisable audit output — treating as a failed scan, not a clean one."
            cat dotnet-vuln.txt
            exit 1
          fi
          if grep -Eiq "Critical|High|Moderate" dotnet-vuln.txt; then
            echo "::error::Vulnerable NuGet package(s) detected (Moderate+). See log above."
            exit 1
          fi
          echo "No Moderate+ NuGet vulnerabilities."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Runtime transitive overrides are pinned to patched postcss/sharp/nanoid releases.
      # Keep this fail-closed so a future lockfile change cannot quietly reintroduce a
      # High/Critical advisory into the independently deployed frontend.
      - name: npm audit (frontend; fail on High/Critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  # ── G5: schema safety gates ───────────────────────────────────────────────────
  # Wave 0 proved these by hand: model/migration drift, a fresh deployment from zero, an
  # upgrade from the previous release with real data, and that both paths converge on the
  # SAME schema. Proving something once is not a control, so each proof runs here on every PR.
  #
  # The drift check is the one that matters most: entity properties added without a migration
  # are what produce tenant-wide 42703 outages, and that is exactly what Wave 0 found sitting
  # uncommitted in the tree.
  # ── WAVE 1 B3: real Chrome role + isolation security gate ─────────────────────────────────────
  # Runs against a REAL stack — Postgres, the real backend with the enterprise-group seed, and a
  # PRODUCTION frontend build. No mocked business API, no fixtures, no hidden demo data.
  #
  # It uses its own Playwright config for one reason: this job must be able to FAIL. The pre-existing
  # e2e suite is "CI-safe by design" and test.skip()s when the stack is unreachable, so a dead backend
  # produces a green run. That is fine for an advisory suite and disqualifying for a required check.
  chrome-security-gate:
    name: Chrome Security Gate (roles + isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: postgres
          POSTGRES_DB: zayra
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build backend
        run: dotnet build backend-dotnet/Zayra.Api/Zayra.Api.csproj -c Release

      # The seed passwords below are LOCAL TEST FIXTURES for an ephemeral CI database that is destroyed
      # with the runner. They are not secrets and grant nothing anywhere else. Real credentials would
      # belong in GitHub secrets; putting fixtures there would only obscure what the gate authenticates as.
      - name: Start backend (enterprise-group seed + platform operator)
        env:
          ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=zayra;Username=postgres;Password=ci'
          Jwt__Issuer: 'Zayra.Api'
          Jwt__TenantAudience: 'kynexone-tenant'
          Jwt__PlatformAudience: 'kynexone-platform'
          Jwt__SigningKey: 'CI_ONLY_EPHEMERAL_SIGNING_KEY_NOT_A_PRODUCTION_SECRET_0123456789'
          SeedAdmin__TenantSlug: 'zayra'
          SeedAdmin__Email: 'admin@zayra.local'
          SeedAdmin__Password: 'ChangeMe123!'
          SeedAdmin__SeedDemoData: 'false'
          SEED_ENTERPRISE_TEST_DATA: 'true'
          PLATFORM_ADMIN_EMAIL: 'admin@platform.local'
          PLATFORM_ADMIN_PASSWORD: 'YourPassword123!'
          ASPNETCORE_ENVIRONMENT: 'Development'
          ASPNETCORE_URLS: 'http://localhost:5117'
        run: |
          set -euo pipefail
          nohup dotnet run --no-launch-profile --no-build -c Release \
            --project backend-dotnet/Zayra.Api/Zayra.Api.csproj > /tmp/api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf -m 5 http://localhost:5117/health/live > /dev/null; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Backend did not become healthy in 90s."
          tail -80 /tmp/api.log
          exit 1

      - name: Build and serve the PRODUCTION frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: 'http://localhost:5117'
        run: |
          set -euo pipefail
          npx next build
          nohup npx next start -p 5173 > /tmp/fe.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -m 5 -o /dev/null http://localhost:5173/; then echo "frontend up"; exit 0; fi
            sleep 1
          done
          echo "::error::Frontend did not start in 60s."
          tail -60 /tmp/fe.log
          exit 1

      - name: Run the Chrome security gate
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: 'http://localhost:5173'
          PLATFORM_ADMIN_EMAIL: 'admin@platform.local'
          PLATFORM_ADMIN_PASSWORD: 'YourPassword123!'
        run: npx playwright test --config=playwright.security.config.ts

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-security-gate-evidence
          # Storage states carry live bearer tokens and are NEVER uploaded — e2e/.auth is excluded.
          path: |
            frontend/test-results/**
            frontend/playwright-report/**
            !frontend/**/.auth/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Backend log on failure
        if: failure()
        run: tail -200 /tmp/api.log || true

  schema-gates:
    name: Schema Gates (drift, fresh deploy, upgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # dotnet-ef is pinned as a LOCAL tool (dotnet-tools.json at the repo root), so a global
      # install is shadowed and `dotnet ef` fails with "Run 'dotnet tool restore'". Install it
      # globally as a fallback AND restore the manifest, so the pinned 8.0.11 is what runs.
      - name: Install EF tools
        run: |
          dotnet tool restore || dotnet tool install --global dotnet-ef --version 8.*
          dotnet tool run dotnet-ef --version || dotnet ef --version

      # The runner image does not ship psql, and the schema-comparison gates below need it.
      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # Build ONCE, then never pass --no-build to an ef command below. `dotnet ef --no-build`
      # reads the STALE compiled snapshot, so drift is reported that does not exist and
      # `migrations add` regenerates the same delta forever. This bit us in Wave 0.
      - name: Build API
        run: dotnet build backend-dotnet/Zayra.Api/Zayra.Api.csproj -c Debug

      - name: Gate — no EF model/migration drift
        working-directory: backend-dotnet/Zayra.Api
        env:
          ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci'
        run: |
          set -euo pipefail
          # Capture the exit code separately. An earlier version used `|| true`, which swallowed a
          # genuine tooling failure and reported "no drift" — a gate that cannot fail is not a gate.
          set +e
          out=$(dotnet tool run dotnet-ef migrations has-pending-model-changes --no-build 2>&1); rc=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "Changes have been made to the model"; then
            echo "::error::EF model drift — an entity changed with no migration. Run 'dotnet ef migrations add <Name>'."
            exit 1
          fi
          if [ $rc -ne 0 ]; then
            echo "::error::The drift check itself failed (exit $rc) — treat as a gate failure, not a pass."
            exit 1
          fi

      - name: Gate — fresh deployment from zero
        working-directory: backend-dotnet/Zayra.Api
        env:
          ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=zayra_fresh;Username=postgres;Password=ci'
        run: |
          set -euo pipefail
          # No CREATE DATABASE needed: 'ef database update' creates it when absent.
          dotnet tool run dotnet-ef database update --no-build

      # `has-pending-model-changes` only compares the model with the snapshot. It cannot detect
      # properties that leaked into an old snapshot/Designer without ever appearing in an Up()
      # migration. Build the schema directly from today's model and require every modeled column
      # (type + nullability included) to exist in the migration-built fresh database.
      - name: Gate — migration schema contains every modeled column
        working-directory: backend-dotnet/Zayra.Api
        env:
          ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci'
        run: |
          set -euo pipefail
          PGPASSWORD=ci createdb -h localhost -U postgres zayra_model
          dotnet tool run dotnet-ef dbcontext script --no-build --no-color \
            | sed '/^\[/d' \
            | PGPASSWORD=ci psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d zayra_model >/dev/null
          q="SELECT table_name||'.'||column_name||':'||data_type||':'||is_nullable FROM information_schema.columns WHERE table_schema='public' AND table_name <> '__EFMigrationsHistory' ORDER BY 1;"
          PGPASSWORD=ci psql -h localhost -U postgres -d zayra_fresh -t -A -c "$q" | sort > /tmp/migrated-cols.txt
          PGPASSWORD=ci psql -h localhost -U postgres -d zayra_model -t -A -c "$q" | sort > /tmp/model-cols.txt
          missing=$(comm -13 /tmp/migrated-cols.txt /tmp/model-cols.txt)
          if [ -n "$missing" ]; then
            echo "::error::Migration-built database is missing modeled columns or has incompatible types/nullability:"
            echo "$missing"
            exit 1
          fi
          echo "Migration schema contains all $(wc -l < /tmp/model-cols.txt) modeled columns."

      # The previous accepted release = the last migration present on the merge base. Applying
      # only up to it, seeding, then upgrading is what proves an EXISTING customer survives the
      # deploy — a fresh-deploy test alone never exercises that path.
      - name: Gate — upgrade from previous release, with data
        working-directory: backend-dotnet/Zayra.Api
        env:
          ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=zayra_upgrade;Username=postgres;Password=ci'
        run: |
          set -euo pipefail
          base=$(git merge-base HEAD origin/${{ github.base_ref || 'main' }})
          prev=$(git ls-tree -r --name-only "$base" -- Migrations \
                 | grep -E 'Migrations/[0-9]{14}_.*\.cs$' | grep -v Designer \
                 | sed 's|.*/||; s|\.cs$||' | sort | tail -1 || true)
          if [ -z "$prev" ]; then
            echo "No migrations on the merge base; fresh-deploy gate already covers this."
            exit 0
          fi
          echo "Previous accepted release migration: $prev"
          dotnet tool run dotnet-ef database update "$prev" --no-build
          PGPASSWORD=ci psql -h localhost -U postgres -d zayra_upgrade -v ON_ERROR_STOP=1 -c "
            INSERT INTO tenants (id,name,slug,is_active,created_at_utc,account_type,company_creation_mode)
            VALUES (gen_random_uuid(),'Upgrade Gate','upgrade-gate',true,now(),'Group','Multi');"
          before=$(PGPASSWORD=ci psql -h localhost -U postgres -d zayra_upgrade -t -A -c 'SELECT count(*) FROM tenants;')
          dotnet tool run dotnet-ef database update --no-build
          after=$(PGPASSWORD=ci psql -h localhost -U postgres -d zayra_upgrade -t -A -c 'SELECT count(*) FROM tenants;')
          if [ "$before" != "$after" ]; then
            echo "::error::Upgrade destroyed data — tenants went from $before to $after."
            exit 1
          fi

      # If these diverge, a migrated customer and a new customer are permanently on different
      # schemas, and every later migration is authored against only one of them.
      - name: Gate — fresh and upgrade converge on the same schema
        run: |
          set -euo pipefail
          q="SELECT table_name||'.'||column_name||':'||data_type||':'||is_nullable FROM information_schema.columns WHERE table_schema='public' ORDER BY 1;"
          qi="SELECT tablename||' :: '||indexdef FROM pg_indexes WHERE schemaname='public' ORDER BY 1;"
          for db in zayra_fresh zayra_upgrade; do
            PGPASSWORD=ci psql -h localhost -U postgres -d $db -t -A -c "$q"  > "cols_$db.txt"
            PGPASSWORD=ci psql -h localhost -U postgres -d $db -t -A -c "$qi" > "idx_$db.txt"
          done
          diff cols_zayra_fresh.txt cols_zayra_upgrade.txt || { echo "::error::Column drift between fresh and upgrade."; exit 1; }
          diff idx_zayra_fresh.txt  idx_zayra_upgrade.txt  || { echo "::error::Index drift between fresh and upgrade."; exit 1; }
          echo "Schemas converge: $(wc -l < cols_zayra_fresh.txt) columns, $(wc -l < idx_zayra_fresh.txt) indexes."

      # ValidateOnBuild/ValidateScopes only protect production if something actually BOOTS.
      # A missing registration or a Singleton capturing a Scoped DbContext fails here.
      - name: Gate — application startup and DI validation
        working-directory: backend-dotnet/Zayra.Api
        env:
          ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=zayra_fresh;Username=postgres;Password=ci'
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: 'http://localhost:5117'
        run: |
          set -euo pipefail
          dotnet run --no-build --no-launch-profile > boot.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -m 5 http://localhost:5117/health/ready > ready.json; then break; fi
            sleep 2
          done
          cat ready.json
          grep -q '"status":"ready"' ready.json || { echo "::error::API did not reach ready."; tail -60 boot.log; exit 1; }
          grep -q '"pendingMigrations":0' ready.json || { echo "::error::Schema behind code at boot."; exit 1; }
          if grep -qE "ValidateOnBuild|Cannot consume scoped|Unable to resolve|Some services are not able" boot.log; then
            echo "::error::DI container validation failed."; grep -nE "Cannot consume scoped|Unable to resolve" boot.log | head; exit 1
          fi

  # ── G5: frontend production build ─────────────────────────────────────────────
  # Typecheck alone never catches a build-time failure (bad import, server/client boundary,
  # env misuse). The deployed artifact is the build, so the build is what must be gated.
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx next build
        working-directory: frontend

  # ── Browser: real tenant journey against the production-shaped Compose topology ──
  # This is intentionally independent of the platform-admin setup project. A missing platform
  # bootstrap account must never suppress the client-pilot proof for dashboard + HRM modules.
  browser-pilot:
    name: Browser Pilot (seeded tenant, core modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start clean enterprise demo stack
        env:
          SEED_DEMO_DATA: 'true'
          SEED_ENTERPRISE_TEST_DATA: 'true'
          # Browser setup authenticates ten distinct enterprise personas and the dedicated auth
          # spec then exercises ten real login outcomes. This override is isolated to the disposable
          # CI stack; docker-compose and deployed environments retain the 10/minute default.
          LOGIN_PERMIT_LIMIT: '25'
          JWT_SIGNING_KEY: 'CI_ONLY_BROWSER_PILOT_SIGNING_KEY_64_CHARS_MINIMUM_12345678901234567890'
        run: docker compose -p zayra-browser-ci up -d --build

      - name: Wait for API and UI readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            api=$(curl -s -o /tmp/api-ready.json -w '%{http_code}' http://127.0.0.1:5117/health/ready || true)
            ui=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/login || true)
            if [ "$api" = 200 ] && [ "$ui" = 200 ]; then
              cat /tmp/api-ready.json
              exit 0
            fi
            sleep 2
          done
          docker compose -p zayra-browser-ci logs --no-color --tail=200
          exit 1

      - name: Run client-pilot browser gate
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          E2E_DEFAULT_TENANT_SLUG: intelliflow
          E2E_DEFAULT_ADMIN_EMAIL: admin@intelliflow.com
          E2E_DEFAULT_ADMIN_PASSWORD: 'IntelliFlow@2026!'
          E2E_MIN_EMPLOYEES: '12'
        run: npx playwright test --project=tenant-pilot

      - name: Run complete enterprise browser and authorization gate
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npx playwright test --project=chromium

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-pilot-results
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Capture stack logs on failure
        if: failure()
        run: docker compose -p zayra-browser-ci logs --no-color --tail=300

      - name: Remove isolated CI stack
        if: always()
        run: docker compose -p zayra-browser-ci down -v

  # ── Migrate: apply EF Core migrations to the production DB BEFORE the deploy hook (P0-4) ──
  # render.yaml sets autoDeploy:false, so the deploy hook is the sole trigger and this job gates
  # it: schema is always applied ahead of the new code, preventing 42703/42P01 tenant-wide. Uses
  # only the connection-string secret (env stays Development so no JWT/SeedAdmin prod fail-fast).
  migrate-backend:
    name: Apply DB Migrations (deploy gate)
    runs-on: ubuntu-latest
    # chrome-security-gate added: it is the lane written to be un-fakeable (retries 0, forbidOnly,
    # positive controls), while browser-pilot is CI-safe by design and can go green against a dead
    # backend. Gating the deploy on the fakeable lane and not the strict one was backwards.
    needs: [backend-tests, frontend-typecheck, frontend-build, browser-pilot, schema-gates, secret-scan, dependency-scan, chrome-security-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # WAVE 1 A4 — this job writes to the PRODUCTION DATABASE. It now runs only inside the protected
    # `production` GitHub environment, which requires a named reviewer's approval and is restricted to
    # protected branches. Before this, a merge to main migrated production with no human in the loop.
    # NOTE: environment approval gates the JOB, not the SECRET. PROD_DATABASE_URL and
    # RENDER_DEPLOY_HOOK_URL are currently REPOSITORY secrets (verified: the Production environment
    # holds zero secrets), so any job in any workflow on any branch can reference them without
    # approval. Move them to this environment to make the boundary real; until then this comment
    # describes an intent, not a control.
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Main runs no longer cancel each other (see the concurrency block), so two approvals can be
      # outstanding at once and approved out of order. Render builds from BRANCH HEAD, so approving
      # the older run would ship newer code than that run believes it is shipping. Refuse.
      - name: Refuse to migrate a superseded commit
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin main
          head=$(git rev-parse origin/main)
          if [ "$head" != "${{ github.sha }}" ]; then
            echo "::error::main moved to $head since this run started (${{ github.sha }}). The later run carries these migrations plus newer ones — approve that run instead."
            exit 1
          fi
          echo "This run is main HEAD ($head)."

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore local tools (dotnet-ef)
        run: dotnet tool restore   # manifest (dotnet-tools.json) is at the repo root

      - name: Apply EF Core migrations (fail-closed)
        run: |
          if [ -z "$ConnectionStrings__Default" ]; then
            echo "::error::PROD_DATABASE_URL secret is not set — cannot gate the deploy on DB migrations. Deploy blocked (fail-closed)."
            exit 1
          fi
          echo "Applying EF Core migrations to the production database…"
          dotnet ef database update --project backend-dotnet/Zayra.Api/Zayra.Api.csproj
        env:
          ConnectionStrings__Default: ${{ secrets.PROD_DATABASE_URL }}

  # ── Build the runtime image in CI, so Render never builds it ──────────────────
  # Render's free-tier builder OOMs (>8GB) compiling the app, so no deploy ever completes even
  # though the image builds in ~30s locally under an 8GB ceiling. GitHub's runner has ample memory:
  # build the exact runtime image here and push it to GHCR. Render is then pointed at this pre-built
  # image (runtime: image) and only PULLS it — removing Render's builder from the deploy path for good.
  build-image:
    name: Build & push backend image (GHCR)
    runs-on: ubuntu-latest
    # chrome-security-gate added: it is the lane written to be un-fakeable (retries 0, forbidOnly,
    # positive controls), while browser-pilot is CI-safe by design and can go green against a dead
    # backend. Gating the deploy on the fakeable lane and not the strict one was backwards.
    needs: [backend-tests, frontend-typecheck, frontend-build, browser-pilot, schema-gates, secret-scan, dependency-scan, chrome-security-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image ref
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/backend" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Build & push image
        run: |
          docker build -f ./Dockerfile -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          echo "Pushed $IMAGE:${{ github.sha }} and :latest"
          # Immutable digest, recorded so a rollback names an exact artifact rather than a tag that
          # has since moved. Render currently builds from the branch and does NOT consume this image
          # — see docs/REPOSITORY_AND_DEPLOYMENT_GOVERNANCE.md, "Known gap: image is built, not deployed".
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}" 2>/dev/null || echo "unknown")
          echo "Image digest: $digest"
          {
            echo "### Image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$IMAGE:${{ github.sha }}\` |"
            echo "| Digest | \`$digest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Deploy: trigger Render redeploy after tests + security gates + migrations pass (main only) ──
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck, secret-scan, dependency-scan, migrate-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # WAVE 1 A4 — protected environment: production deploys require explicit approval.
    environment: production
    steps:
      # Rollback anchor. Captured BEFORE the new release goes out, because after it lands the
      # question "what was running a minute ago?" has no answer anywhere else — Render builds from
      # the branch, so there is no image digest to roll back to on its side.
      - name: Record currently-deployed commit (rollback anchor)
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          set -uo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "::error::vars.PRODUCTION_BASE_URL is not set — deploy verification is impossible."
            exit 1
          fi
          prev=$(curl -sf -m 60 "$BASE_URL/health/live" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("commit","unknown"))' 2>/dev/null || echo "unreachable")
          echo "PREVIOUS_COMMIT=$prev" >> "$GITHUB_ENV"
          echo "Previously deployed commit: $prev"
          {
            echo "### Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Previous commit (rollback target) | \`$prev\` |"
            echo "| New commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Render deploy hook
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            # -sf so an HTTP error is a non-zero exit rather than a body we ignore. The response
            # body carries a deploy id but no status; the verify step below is what proves anything.
            curl -sf -X POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null
            echo "Render deploy triggered."
          else
            # autoDeploy is OFF (render.yaml), so a missing hook means NOTHING deploys.
            # Fail loudly rather than silently no-op.
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set and autoDeploy is false — no deploy will occur. Set the hook secret."
            exit 1
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      # THE FIX FOR THE REAL DEFECT. Until now this job POSTed a webhook and exited 0 — so a green
      # "Deploy Backend" meant only "Render accepted the request", never "the new code is serving
      # traffic". A failed build, a crash loop, or a deploy that never started all reported success.
      # Wave 1 A1 caught exactly this: main was green while production still ran older code.
      - name: Verify the deployed commit is actually serving traffic
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 900 ))   # 15 min: a Render free-tier Docker build is slow
          attempt=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            live=$(curl -sf -m 30 "$BASE_URL/health/live" 2>/dev/null || echo '{}')
            got=$(echo "$live" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || echo "")
            if [ "$got" = "$EXPECTED" ]; then
              echo "Deployed commit verified: $got (attempt $attempt)"
              ready=$(curl -s -m 60 -o /tmp/ready.json -w '%{http_code}' "$BASE_URL/health/ready" || echo 000)
              if [ "$ready" != "200" ]; then
                echo "::error::Commit $EXPECTED is live but /health/ready returned $ready — not serving."
                python3 -c 'import json;d=json.load(open("/tmp/ready.json"));print("pendingMigrations:",d.get("pendingMigrations"))' 2>/dev/null || true
                exit 1
              fi
              echo "/health/ready is 200."
              exit 0
            fi
            echo "attempt $attempt: live commit='$got' expected='$EXPECTED' — waiting"
            sleep 20
          done
          echo "::error::Timed out after 15m. Production is NOT running $EXPECTED (last seen: '${got:-unreachable}'). Previous commit was ${PREVIOUS_COMMIT:-unknown}. See docs/DEPLOY_ROLLBACK_RUNBOOK.md."
          exit 1

  # The human half of the 2026-08-26 incident: migrate-backend showed `cancelled`, which reads like
  # `skipped`, so four consecutive merges silently failed to ship and nobody noticed. A merge that
  # does not reach production is now a red run, deliberately — a benign-looking terminal state is
  # what hid this.
  release-outcome:
    name: Release outcome (main)
    runs-on: ubuntu-latest
    needs: [migrate-backend, deploy-backend]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Fail if main merged but production did not ship
        run: |
          m='${{ needs.migrate-backend.result }}'
          d='${{ needs.deploy-backend.result }}'
          echo "migrate-backend=$m  deploy-backend=$d"
          if [ "$m" != "success" ] || [ "$d" != "success" ]; then
            echo "::error::main merged but production did NOT ship (migrate=$m, deploy=$d). Production is now BEHIND main. See docs/DEPLOY_ROLLBACK_RUNBOOK.md."
            exit 1
          fi
          echo "Production is running this commit."
