name: Mobile CI

on:
  # Every PR runs this workflow so the "Mobile gate" job always reports and can be
  # a required check; the expensive verify job still runs only when mobile/ changed.
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          # Fail safe: anything we cannot diff (unknown or zero SHA, a failed git diff) runs
          # verify. Only a diff that succeeded and touched nothing under mobile/ skips it.
          run_verify() { echo "mobile=true" >> "$GITHUB_OUTPUT"; exit 0; }
          for sha in "$BASE" "$HEAD"; do
            if [ -z "$sha" ] || ! git cat-file -e "$sha^{commit}" 2>/dev/null; then run_verify; fi
          done
          files=$(git diff --name-only "$BASE...$HEAD") || run_verify
          if grep -qE '^(mobile/|\.github/workflows/mobile-ci\.yml$)' <<<"$files"; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_API_BASE_URL: https://zayra-ai-workforce.onrender.com/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Unit tests are TypeScript files executed by Node's native test runner.
          # Node 24 provides the required built-in type stripping; Node 20 exits
          # before running any assertion with ERR_UNKNOWN_FILE_EXTENSION.
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run store:check

  # The required check. Passes when verify passed, or when verify was skipped because
  # nothing under mobile/ changed; fails on any other outcome, including a failed diff.
  gate:
    name: Mobile gate
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          MOBILE: ${{ needs.changes.outputs.mobile }}
        run: |
          echo "changes=$CHANGES mobile=$MOBILE verify=$VERIFY"
          [ "$CHANGES" = "success" ] || exit 1
          if [ "$MOBILE" = "true" ]; then [ "$VERIFY" = "success" ] || exit 1; fi
          [ "$VERIFY" = "success" ] || [ "$VERIFY" = "skipped" ] || exit 1
