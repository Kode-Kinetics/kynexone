name: CodeQL (SAST)

# Static Application Security Testing across the C# backend and the TS/JS frontend.
# Catches injection, deserialization, hardcoded-secret, and taint-flow issues that unit
# tests and typecheck do not. Runs on every PR/push to main and on a weekly schedule so
# newly-published rules re-scan existing code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Mondays 03:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Pin during GitHub's Oct-Nov 2026 ubuntu-latest migration; the moving
    # pool repeatedly terminated clean .NET builds with runner shutdowns.
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            # Keep extraction deterministic: autobuild can select the much larger test
            # project, which is not the shipped application and has repeatedly lost its
            # hosted runner before extraction completes.
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          # security-extended adds higher-signal security queries beyond the default set.
          queries: security-extended

      - name: Setup .NET (csharp manual build)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build shipped backend for CodeQL
        if: matrix.language == 'csharp'
        run: dotnet build backend-dotnet/Zayra.Api/Zayra.Api.csproj --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
