name: CodeQL (SAST)

# Static Application Security Testing across the C# backend and the TS/JS frontend.
# Catches injection, deserialization, hardcoded-secret, and taint-flow issues that unit
# tests and typecheck do not. Runs on every PR/push to main and on a weekly schedule so
# newly-published rules re-scan existing code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Mondays 03:00 UTC

# Rapid agent pushes used to leave every superseded C# analysis compiling on a paid runner.
# Keep main and scheduled scans independent, but cancel an older run for the same PR branch.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_gcServer: '0'
      DOTNET_GCHeapCount: '1'
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            # Keep extraction deterministic: autobuild can select the much larger test
            # project, which is not the shipped application and has repeatedly lost its
            # hosted runner before extraction completes.
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          # security-extended adds higher-signal security queries beyond the default set.
          queries: security-extended

      - name: Setup .NET (csharp manual build)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add swap (the backend compile peaks near the runner's 16 GB)
        if: matrix.language == 'csharp'
        run: ./scripts/ci/add-swap.sh

      - name: Restore shipped backend dependencies
        if: matrix.language == 'csharp'
        run: dotnet restore backend-dotnet/Zayra.Api/Zayra.Api.csproj

      - name: Build shipped backend for CodeQL
        if: matrix.language == 'csharp'
        run: >-
          dotnet build backend-dotnet/Zayra.Api/Zayra.Api.csproj --no-restore --configuration Release
          -p:UseSharedCompilation=false -maxcpucount:1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
