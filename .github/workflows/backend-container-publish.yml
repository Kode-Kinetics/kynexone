# Builds the ROOT Dockerfile — the one API image client installations run, every stage — on every backend PR,
# so a broken instruction in the final runtime stage (COPY, RUN, USER) fails here and not at a client's upgrade.
name: Production Dockerfile build

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend-dotnet/**'
      - '.github/workflows/backend-container-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-trimmed-runtime:
    name: Production Dockerfile build (client API image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The FULL image (no --target): a broken instruction in the final runtime stage (COPY, RUN, USER)
      # must fail here too, not only the build stage. Nothing is pushed.
      - name: Build the root Dockerfile (full image, not published)
        run: docker build -f Dockerfile -t kynexone-container-publish-check .
