services:
  - type: web
    # Renamed 2026-08-26 to match the product. NOTE: the .onrender.com hostname is fixed at
    # service creation and does NOT follow the name — the service is "kynexone" but still serves
    # on zayra-ai-workforce.onrender.com, which is why AllowedHosts below is unchanged and why the
    # frontend's NEXT_PUBLIC_API_BASE_URL did not need updating. Do not "correct" that hostname to
    # match the name; it would point at nothing.
    name: kynexone
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    branch: main
    # P0-4/P2-18: single deploy trigger. autoDeploy is OFF so the ONLY path to production is the
    # CI-gated Render deploy hook (.github/workflows/ci.yml → deploy-backend), which fires only
    # AFTER tests + security gates + the DB-migration step succeed. Two triggers (autoDeploy + hook)
    # risked overlapping deploys per commit.
    autoDeploy: false
    # Gate traffic on migration parity. /health/ready returns 503 while migrations are pending
    # (ProductionReadinessEvidence.ResolveStatus), so Render keeps the old instance live until
    # `--migrate` has run.
    #
    # THIS CLAIM WAS FALSE FROM 2026-08 UNTIL 2026-09-21 AND IS WORTH KNOWING WHY. The text here
    # used to promise that "a migration-bearing image deployed against an un-migrated DB is NEVER
    # promoted". It could not have been: ./Dockerfile deletes Migrations/ before publishing, and
    # GetPendingMigrationsAsync() is "migrations compiled into the assembly MINUS applied history",
    # so in the deployed image it subtracted from an empty set and returned 0 pending for EVERY
    # database. /health/ready reported `ready` against a DB missing twelve migrations, and that is
    # how a release was promoted onto an un-migrated schema. The gate was a no-op by construction
    # for as long as the promise was written here.
    #
    # What makes it true now: the Dockerfile records the migration ids into an embedded
    # Migrations.manifest BEFORE stripping the classes, and the readiness check diffs that against
    # __EFMigrationsHistory. If neither the assembly nor a manifest knows any migrations, the check
    # returns the -1 unknown sentinel and reports not_ready — it fails CLOSED instead of reporting
    # a comfortable zero. See Infrastructure/Operations/MigrationManifest.cs and
    # Zayra.Api.Tests/DeployHardeningTests.cs, which fails if this comment's mechanism is removed.
    healthCheckPath: /health/ready
    # ── DB MIGRATIONS ON DEPLOY (P0-4) ──────────────────────────────────────────────
    # Migrations are applied by the CI `migrate-backend` job (dotnet ef database update against the
    # production DB) which the deploy hook depends on — so schema is always ahead of code.
    # ENABLED 2026-09-17 (service moved to Starter, $7/mo — pre-deploy commands need a paid plan).
    # Render runs this AFTER the new image builds but BEFORE any traffic shifts to it, and aborts
    # the deploy if it exits non-zero. That ties migrations to the deploy itself and fixes the
    # failure mode the CI `migrate-backend` job had: `concurrency: cancel-in-progress` in ci.yml
    # could cancel a migrate job waiting on the `production` environment approval while the deploy
    # still went ahead, putting new code on an old schema (42P01 relation does not exist).
    #
    # `--migrate` is handled at the TOP of Program.cs by MigrateOnlyEntryPoint: it applies EF
    # migrations and exits without constructing the web host at all.
    #
    # ITS ONLY PRECONDITION IS ConnectionStrings__Default. That is a deliberate change, made
    # because the previous arrangement caused this outage. `--migrate` used to be handled near the
    # END of Program.cs, after the whole service graph had been built, so every fail-fast guard in
    # it was a precondition of migrating. The comment that stood here named the seed-admin and JWT
    # guards — and missed the reverse-proxy guard 100 lines earlier, which fires FIRST and is the
    # one that actually killed the job: Proxy__TrustForwardedHeaders was "true" with neither
    # Proxy__KnownProxies nor Proxy__KnownNetworks set, so the pre-deploy job threw
    # InvalidOperationException ~10s in, twice, and never opened a connection to the database.
    # A comment that lists the guards it knows about is a hazard when the list is incomplete.
    #
    # NO preDeployCommand, DELIBERATELY. It used to say `dotnet Zayra.Api.dll --migrate`, and on
    # 2026-09-22 a blueprint sync (triggered by PR #74 editing this file) applied it to the live
    # service for the first time. Every deploy then failed at pre-deploy, because the Dockerfile
    # strips Migrations/ from the image (`RUN rm -rf Migrations`, to keep the Render builder under
    # its memory limit) and `--migrate` correctly refuses to run with nothing compiled in:
    #   "[--migrate] FAILED: this build has NO migrations compiled into it ..."
    # The one migration path is the CI `migrate-backend` job (`dotnet ef database update` against
    # PROD_DATABASE_URL, gated on the `production` environment approval), which runs from a full
    # source checkout. Do not re-add a pre-deploy migration unless the image stops stripping them.
    # Removing the key here does not clear a value already set on the service: that is cleared in
    # the dashboard (Settings -> Pre-Deploy Command). See docs/DEPLOY_ROLLBACK_RUNBOOK.md.
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: PORT
        value: 8080
      # Render terminates TLS at its load balancer. Opt in to X-Forwarded-For/Proto handling so
      # secure links, scheme checks, audit IPs, and rate-limit partitions reflect the real request.
      - key: Proxy__TrustForwardedHeaders
        value: "true"
      # REQUIRED: trusted Render proxy CIDR(s), comma-separated (Render's internal network is
      # 10.0.0.0/8). The app fails closed if forwarding is enabled without an explicit trust
      # boundary — correctly, but this key being unset is what broke the 2026-09-21 release.
      # `sync: false` is a note to a human, not a control: Render does not enforce it. The
      # scripts/check_render_env.py CI gate is what turns every `sync: false` below into a
      # verified precondition of deploying.
      - key: Proxy__KnownNetworks
        sync: false
      # Fail closed on unexpected Host headers instead of appsettings' local-development wildcard.
      - key: AllowedHosts
        value: zayra-ai-workforce.onrender.com;localhost

      # ── Memory, logging and rate limits: set on the live service 2026-09-22 after 12 OOM kills ──
      # GC values are parsed as HEX — keep the 0x prefix (see the Dockerfile's runtime stage).
      # 0x14000000 = 320 MiB for the 512 MB Starter plan; use 0x60000000 (1.5 GiB) on Standard.
      - key: DOTNET_gcServer
        value: "0"
      - key: DOTNET_GCHeapHardLimit
        value: "0x14000000"
      # Per-statement SQL logging at Information cost CPU and memory on every request.
      - key: Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command
        value: Warning
      # Limits are per client IP. Raised so a room of users on one network does not share the
      # default 10 logins/min; revisit once real client IPs are verified behind the Vercel proxy.
      - key: RateLimit__LoginPermitLimit
        value: "100"
      - key: RateLimit__RefreshPermitLimit
        value: "300"

      # ── REQUIRED SECRETS: set these in the Render dashboard (Environment → Secret Files / Env Vars) ──
      #
      # ConnectionStrings__Default
      #   Neon PostgreSQL connection string.
      #   Format: Host=<host>;Port=5432;Database=zayra;Username=<user>;Password=<pass>;SSL Mode=Require;Trust Server Certificate=true;
      - key: ConnectionStrings__Default
        sync: false

      # Jwt__SigningKey
      #   ≥64-char random secret. Generate: openssl rand -base64 64
      - key: Jwt__SigningKey
        sync: false

      # Jwt__TenantAudience
      #   Audience claim for tenant (non-platform) JWTs. Must NOT equal "kynexone-tenant" (dev default).
      #   Example: KynexOneTenantProd
      - key: Jwt__TenantAudience
        sync: false

      # Jwt__PlatformAudience
      #   Audience claim for platform-admin JWTs. Must NOT equal "kynexone-platform" (dev default).
      #   Example: KynexOnePlatformProd
      - key: Jwt__PlatformAudience
        sync: false

      # SeedAdmin__Email / SeedAdmin__Password
      #   Credentials for the bootstrap admin account created on first boot. REQUIRED — the app
      #   refuses to boot in Production when SeedAdmin__Password is unset or the weak default.
      - key: SeedAdmin__Email
        sync: false
      - key: SeedAdmin__Password
        sync: false

      # ── NON-SECRET CONFIG ───────────────────────────────────────────────────────────
      - key: Jwt__Issuer
        value: Zayra.Api

      - key: SeedAdmin__TenantName
        value: KynexOne
      - key: SeedAdmin__TenantSlug
        value: zayra

      # Demo data seeder. MUST be "false" in any environment that holds REAL customer data:
      # when "true", every deploy re-runs the demo seeders/cleanups, which create, deactivate,
      # rename and re-seed demo tenants — and that churn can wipe or revert live data. Production
      # runs ONLY idempotent global config (auth bootstrap, GOSI/statutory rules, pricing); it never
      # touches tenant data. Use a SEPARATE demo/staging service with this set "true" for showcases.
      - key: SeedAdmin__SeedDemoData
        value: "false"

      # Dedicated / client-hosted deployment hard lock (defense in depth). Production is already
      # treated as dedicated, but setting this explicitly keeps demo seeders off even if
      # ASPNETCORE_ENVIRONMENT is ever pointed at a non-Production slot.
      - key: DEDICATED_DEPLOYMENT
        value: "true"

      # Web service never runs migrations on startup in Production.
      # Migrations are applied via a Render one-off job:
      #   dotnet Zayra.Api.dll --migrate
      # Set to "true" ONLY for local development convenience.
      - key: Database__RunMigrationsOnStartup
        value: "false"

      # CORS — add your real Vercel/frontend URL here (comma-separated for multiple).
      # appsettings.json already whitelists https://kynexone.vercel.app.
      # If your Vercel URL differs, add it here:
      - key: CORS_EXTRA_ORIGINS
        value: ""

      # AI provider. "none" disables AI entirely; "ollama" uses Ollama Cloud.
      # The live service runs Ollama Cloud, so this must NOT say "none" — a blueprint
      # sync would silently switch the assistant off and the product would correctly
      # report enabled=false with nobody having asked for that.
      - key: AI_PROVIDER
        value: ollama
      # Ollama Cloud base URL. AiAdvisoryService trusts AI_PROVIDER=ollama without
      # checking this, so an empty value means a 100s hang against localhost:11434.
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      # Secrets — set in the Render dashboard, never in the blueprint.
      - key: OLLAMA_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

      # ── DOCUMENT STORAGE (P0-5) ─────────────────────────────────────────────────────
      # The dyno filesystem is EPHEMERAL on EVERY Render plan without a mounted persistent disk,
      # not just on free — LocalDocumentStorage would lose every uploaded compliance document
      # (offer letters, IDs, contracts) on each restart/redeploy, breaking KSA/GOSI statutory
      # retention. The app FAILS FAST at boot in Production unless a durable S3-compatible backend
      # is configured (DocumentStorageRegistration.ResolveAndValidate).
      # Do NOT revert this now that the service is on a paid plan: leaving free did not make the
      # filesystem durable. Documents live in object storage, not on the dyno disk.
      #
      # PDPL/GDPR RESIDENCY: pin the bucket to an APPROVED GCC/KSA (or adequacy) jurisdiction.
      # Set Storage__Region/Storage__Endpoint to that region's endpoint — do NOT leave a generic
      # "auto" for personal-data buckets. Record the chosen jurisdiction in the deploy runbook.
      # Production fails closed until these durable object-storage settings are provisioned.
      # No local/ephemeral escape hatch is accepted outside Development.
      - key: Storage__Provider
        value: s3
      - key: Storage__Bucket
        sync: false
      - key: Storage__Endpoint          # R2: https://<acct>.r2.cloudflarestorage.com ; empty for AWS
        sync: false
      - key: Storage__AccessKey
        sync: false
      - key: Storage__SecretKey
        sync: false
      - key: Storage__Region            # pin to an approved GCC/KSA region (or R2 bucket's jurisdiction)
        sync: false
