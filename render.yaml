services:
  - type: web
    name: zayra-ai-workforce
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: main
    # P0-4/P2-18: single deploy trigger. autoDeploy is OFF so the ONLY path to production is the
    # CI-gated Render deploy hook (.github/workflows/ci.yml → deploy-backend), which fires only
    # AFTER tests + security gates + the DB-migration step succeed. Two triggers (autoDeploy + hook)
    # risked overlapping deploys per commit.
    autoDeploy: false
    # P0-4: gate traffic on migration parity. /health/ready returns 503 while EF reports pending
    # migrations (ProductionReadinessEvidence.ResolveStatus), so a migration-bearing image deployed
    # against an un-migrated DB is NEVER promoted to serve traffic — Render keeps the old instance
    # live until `--migrate` has run. This backstop works on ANY plan (including free).
    healthCheckPath: /health/ready
    # ── DB MIGRATIONS ON DEPLOY (P0-4) ──────────────────────────────────────────────
    # Migrations are applied by the CI `migrate-backend` job (dotnet ef database update against the
    # production DB) which the deploy hook depends on — so schema is always ahead of code.
    # Render's native `preDeployCommand: dotnet Zayra.Api.dll --migrate` is the preferred mechanism
    # and should be enabled once the WEB service is bumped to a Starter instance (pre-deploy commands
    # are not available on plan:free). Until then, the CI migrate step + the /health/ready gate above
    # are the enforced controls. See docs/DEPLOY_ROLLBACK_RUNBOOK.md.
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: PORT
        value: 8080

      # ── REQUIRED SECRETS: set these in the Render dashboard (Environment → Secret Files / Env Vars) ──
      #
      # ConnectionStrings__Default
      #   Neon PostgreSQL connection string.
      #   Format: Host=<host>;Port=5432;Database=zayra;Username=<user>;Password=<pass>;SSL Mode=Require;Trust Server Certificate=true;
      - key: ConnectionStrings__Default
        sync: false

      # Jwt__SigningKey
      #   ≥64-char random secret. Generate: openssl rand -base64 64
      - key: Jwt__SigningKey
        sync: false

      # Jwt__TenantAudience
      #   Audience claim for tenant (non-platform) JWTs. Must NOT equal "kynexone-tenant" (dev default).
      #   Example: KynexOneTenantProd
      - key: Jwt__TenantAudience
        sync: false

      # Jwt__PlatformAudience
      #   Audience claim for platform-admin JWTs. Must NOT equal "kynexone-platform" (dev default).
      #   Example: KynexOnePlatformProd
      - key: Jwt__PlatformAudience
        sync: false

      # SeedAdmin__Email / SeedAdmin__Password
      #   Credentials for the bootstrap admin account created on first boot. REQUIRED — the app
      #   refuses to boot in Production when SeedAdmin__Password is unset or the weak default.
      - key: SeedAdmin__Email
        sync: false
      - key: SeedAdmin__Password
        sync: false

      # ── NON-SECRET CONFIG ───────────────────────────────────────────────────────────
      - key: Jwt__Issuer
        value: Zayra.Api

      - key: SeedAdmin__TenantName
        value: KynexOne
      - key: SeedAdmin__TenantSlug
        value: zayra

      # Demo data seeder. MUST be "false" in any environment that holds REAL customer data:
      # when "true", every deploy re-runs the demo seeders/cleanups, which create, deactivate,
      # rename and re-seed demo tenants — and that churn can wipe or revert live data. Production
      # runs ONLY idempotent global config (auth bootstrap, GOSI/statutory rules, pricing); it never
      # touches tenant data. Use a SEPARATE demo/staging service with this set "true" for showcases.
      - key: SeedAdmin__SeedDemoData
        value: "false"

      # Dedicated / client-hosted deployment hard lock (defense in depth). Production is already
      # treated as dedicated, but setting this explicitly keeps demo seeders off even if
      # ASPNETCORE_ENVIRONMENT is ever pointed at a non-Production slot.
      - key: DEDICATED_DEPLOYMENT
        value: "true"

      # Web service never runs migrations on startup in Production.
      # Migrations are applied via a Render one-off job:
      #   dotnet Zayra.Api.dll --migrate
      # Set to "true" ONLY for local development convenience.
      - key: Database__RunMigrationsOnStartup
        value: "false"

      # CORS — add your real Vercel/frontend URL here (comma-separated for multiple).
      # appsettings.json already whitelists https://kynexone.vercel.app.
      # If your Vercel URL differs, add it here:
      - key: CORS_EXTRA_ORIGINS
        value: ""

      # AI provider — set to "none" to disable AI features entirely.
      - key: AI_PROVIDER
        value: none

      # ── DOCUMENT STORAGE (P0-5) ─────────────────────────────────────────────────────
      # The dyno filesystem is EPHEMERAL on plan:free — LocalDocumentStorage would lose every
      # uploaded compliance document (offer letters, IDs, contracts) on each restart/redeploy,
      # breaking KSA/GOSI statutory retention. The app FAILS FAST at boot in Production unless a
      # durable S3-compatible backend is configured (DocumentStorageRegistration.ResolveAndValidate).
      # This keeps plan:free — documents live in object storage, not on the dyno disk.
      #
      # PDPL/GDPR RESIDENCY: pin the bucket to an APPROVED GCC/KSA (or adequacy) jurisdiction.
      # Set Storage__Region/Storage__Endpoint to that region's endpoint — do NOT leave a generic
      # "auto" for personal-data buckets. Record the chosen jurisdiction in the deploy runbook.
      - key: Storage__Provider          # value: s3  (required in Production)
        value: s3
      - key: Storage__Bucket
        sync: false
      - key: Storage__Endpoint          # R2: https://<acct>.r2.cloudflarestorage.com ; empty for AWS
        sync: false
      - key: Storage__AccessKey
        sync: false
      - key: Storage__SecretKey
        sync: false
      - key: Storage__Region            # pin to an approved GCC/KSA region (or R2 bucket's jurisdiction)
        sync: false
